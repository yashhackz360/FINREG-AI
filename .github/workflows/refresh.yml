name: Refresh regulatory data

on:
  schedule:
    - cron: "30 1 * * *"   # daily at 07:00 IST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Refresh knowledge base
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
        run: python scripts/refresh_data.py --max-new 15
      - name: Commit refreshed artifacts
        run: |
          git config user.name "finreg-bot"
          git config user.email "finreg-bot@users.noreply.github.com"
          git add -f artifacts/latest_summaries.json artifacts/bm25_index.pkl
          git diff --cached --quiet || (git commit -m "Daily data refresh" && git push origin deploy)
